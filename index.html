  istanbul: {"tr": [["Ayasofya", "537'de açılan kubbe; Prokopios onu \"göğe asılı\" diye anlatır. UNESCO listesindeki Tarihi Yarımada'nın kalbi."], ["Kariye (Khora)", "14. yüzyıl Bizans mozaikleri ve freskleri."], ["Süleymaniye Camii", "16. yüzyıl; UNESCO'nun İstanbul kaydında Ayasofya ile birlikte anılır."]], "en": [["Hagia Sophia", "The dome dedicated in 537; Procopius describes it as \"suspended from Heaven\". The heart of the UNESCO-listed historic peninsula."], ["Chora (Kariye)", "14th-century Byzantine mosaics and frescoes."], ["Süleymaniye Mosque", "16th century; named with Hagia Sophia in UNESCO's Istanbul listing."]]},

  antalya: {"tr": [["Aspendos Tiyatrosu", "MS 2. yüzyıl, mimar Zenon. Antik çağın en iyi korunmuş tiyatrolarından biri sayılır."], ["Perge", "Sütunlu cadde, stadyum ve kent kapıları."], ["Antalya Müzesi", "Perge'den çıkan imparatorluk dönemi heykelleri."]], "en": [["Aspendos Theatre", "2nd century AD, by the architect Zeno. Counted among the best preserved theatres of antiquity."], ["Perge", "Colonnaded street, stadium and city gates."], ["Antalya Museum", "Imperial-era statues from Perge."]]},
  sanliurfa: {"tr": [["Göbeklitepe", "MÖ 9600–8200 arasında avcı-toplayıcıların diktiği, hayvan kabartmalı T biçimli dikilitaşlar (UNESCO)."], ["Urfa Adamı", "MÖ 9000 dolaylarından; en eski gerçek boyutlu insan heykellerinden biri sayılır. Şanlıurfa Arkeoloji Müzesi'nde."], ["Harran", "Konik kubbeli kerpiç evler ve antik kentin kalıntıları."]], "en": [["Göbekli Tepe", "T-shaped pillars carved with animals, raised by hunter-gatherers between 9600 and 8200 BC (UNESCO)."], ["Urfa Man", "From around 9000 BC; considered one of the oldest life-size human statues. In the Şanlıurfa Archaeology Museum."], ["Harran", "Beehive-domed mud-brick houses and the ruins of the ancient city."]]},
  gaziantep: {"tr": [["Zeugma Mozaik Müzesi", "2011'de açıldı; dünyanın en büyük mozaik müzelerinden biri olarak tanıtılır."], ["Çingene Kızı", "Zeugma'nın simgesi olan mozaik portre."], ["Villa mozaikleri", "Mitoloji sahneleri, Fırat kıyısındaki evlerin zeminlerinden."]], "en": [["Zeugma Mosaic Museum", "Opened in 2011; presented as one of the largest mosaic museums in the world."], ["The Gypsy Girl", "The mosaic portrait that became Zeugma's emblem."], ["Villa mosaics", "Scenes from myth, from the floors of houses by the Euphrates."]]},

var sesCalisiyor = false;

function seslendir(){
  if (sesCalisiyor){ sesDurdur(); return; }
  if (!('speechSynthesis' in window)){ bildir(t('sesYok')); return; }
  var yer = bul(D.secili); if (!yer) return;
  var u = new SpeechSynthesisUtterance(DERIN[yer.id][D.dil].dinle);
  u.lang = D.dil === 'tr' ? 'tr-TR' : 'en-GB'; u.rate = 0.95;
  try { var sesler = speechSynthesis.getVoices().filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf(D.dil) === 0; }); if (sesler.length) u.voice = sesler[0]; } catch(e){}
  u.onend = u.onerror = function(){ sesCalisiyor = false; var b = $('ses-btn'); if (b) b.textContent = t('dinle'); };
  speechSynthesis.cancel(); speechSynthesis.speak(u); sesCalisiyor = true;
  var b = $('ses-btn'); if (b) b.textContent = t('durdur');
}

  $('pasaport-bolum').innerHTML = '<div class="etiket">ΔΙΑΒΑΤΗΡΙΟΝ</div><h2>' + h(t('pasaport')) + ' · ' + n + ' / ' + YERLER.length + '</h2><p class="soluk">' + h(t('pasaportAlt')) + '</p>' +
    '<div class="pasaport">' + YERLER.map(function(yer){ return '<button type="button" data-yer="' + yer.id + '">' + muhurSVG(yer, !!D.muhur[yer.id]) + '<span>' + h(y(yer).ad) + '</span></button>'; }).join('') + '</div>' +
    '<p class="yakinda">' + h(t('yakinda')) + '</p>';
}

function metinCiz(){
  document.documentElement.lang = D.dil;
  document.title = t('baslik');
  $('ust-etiket').textContent = t('etiket'); $('baslik').textContent = t('baslik'); $('giris').textContent = t('giris');
  $('z-tum').textContent = t('tum'); $('z-ege').textContent = t('ege'); $('z-bag').textContent = t('baglarGoster'); $('harita-not').textContent = (D.zum === 'tum' ? t('egeNot') + ' ' : '') + (D.bag ? t('baglarNot') : '');
  var zr = $('z-rota'), RR = rotaBul(D.rota); zr.hidden = !RR; if (RR){ zr.textContent = t('rotaCip').replace('{ad}', RR[D.dil].ad); zr.style.setProperty('--r', RR.renk); }
  $('ust-link').textContent = t('efesLink'); $('haritaya').textContent = t('haritaya');
  $('alt').innerHTML = '<p>' + h(t('alt1')) + '</p><p>' + h(t('alt2')) + '</p>';
  document.querySelectorAll('[data-dil]').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-dil') === D.dil); });
}
function hepsi(odakla){ metinCiz(); haritaCiz(); listeCiz(); panelCiz(odakla); rotaBolumCiz(); konakBolumCiz(); sesBolumCiz(); rehberBolumCiz(); pasaportCiz(); haritayaGuncelle(); }

/* ==========================================================================
   SÖZ KARTI (1080x1350 PNG, paylaşılabilir)
   ========================================================================== */
function satirlara(ctx, metin, gen){
  var kel = metin.split(' '), sat = [], s = '';
  kel.forEach(function(k){ var d = s ? s + ' ' + k : k; if (ctx.measureText(d).width > gen && s){ sat.push(s); s = k; } else s = d; });
  if (s) sat.push(s); return sat;
}
function amblemResmi(id){
  return new Promise(function(ok){
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" fill="none" stroke="#FBF6EA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#FBF6EA">' + AMBLEM[id] + '</svg>';
    var img = new Image(); img.onload = function(){ ok(img); }; img.onerror = function(){ ok(null); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
async function kartYap(){
  var yer = bul(D.secili); if (!yer) return;
  try { await Promise.all([document.fonts.load('600 34px Cinzel'), document.fonts.load('italic 500 64px "EB Garamond"')]); } catch(e){}
  var c = document.createElement('canvas'); c.width = 1080; c.height = 1350;
  var x = c.getContext('2d'), s = yer.soz, F = '"EB Garamond", Georgia, serif';
  x.fillStyle = '#14202C'; x.fillRect(0, 0, 1080, 1350);
  /* yıldız tozu, meander bantlar ve mekân renginde madalyon */
  for (var yi = 0; yi < 90; yi++){ var sx = (yi * 397) % 1080, sy = (yi * 211) % 1350; x.fillStyle = 'rgba(255,255,255,' + (0.12 + (yi % 5) * 0.06) + ')'; x.beginPath(); x.arc(sx, sy, 1 + (yi % 3) * 0.6, 0, 7); x.fill(); }
  function meander(y0){ x.strokeStyle = '#E3B38A'; x.lineWidth = 3; x.beginPath(); for (var mx = 60; mx < 1020; mx += 48){ x.moveTo(mx, y0 + 22); x.lineTo(mx + 36, y0 + 22); x.lineTo(mx + 36, y0 + 2); x.lineTo(mx + 8, y0 + 2); x.lineTo(mx + 8, y0 + 16); x.lineTo(mx + 28, y0 + 16); x.lineTo(mx + 28, y0 + 8); x.lineTo(mx + 18, y0 + 8); x.moveTo(mx + 36, y0 + 22); x.lineTo(mx + 48, y0 + 22); } x.stroke(); }
  meander(70); meander(1256);
  x.fillStyle = RENK[yer.id]; x.beginPath(); x.arc(540, 250, 140, 0, 7); x.fill();
  x.strokeStyle = '#E3B38A'; x.lineWidth = 3; x.beginPath(); x.arc(540, 250, 152, 0, 7); x.stroke();
  var img = await amblemResmi(yer.id); if (img) x.drawImage(img, 428, 138, 224, 224);
  x.fillStyle = '#E3B38A'; x.textAlign = 'center'; x.font = '600 34px Cinzel, ' + F;
  x.fillText(yer.yunan.split('').join(' '), 540, 470);
  x.fillStyle = '#F4F1EA'; x.font = (s.eser ? '600 ' : 'italic 500 ') + '64px ' + F;
  var metin = s.eser ? s[D.dil] : '“' + s[D.dil] + '”', sat = satirlara(x, metin, 860), yuk = 82, y0 = 700 - (sat.length - 1) * yuk / 2;
  sat.forEach(function(l, i){ x.fillText(l, 540, y0 + i * yuk); });
  x.fillStyle = '#C3CEDA'; x.font = '400 32px ' + F;
  satirlara(x, (D.dil === 'en' && s.kaynakEn) ? s.kaynakEn : s.kaynak, 860).forEach(function(l, i){ x.fillText(l, 540, y0 + sat.length * yuk + 30 + i * 42); });
  x.fillStyle = '#E3B38A'; x.font = '600 28px Cinzel, ' + F; x.fillText((t('kartAlt') + ' · ' + y(yer).ad).toLocaleUpperCase(D.dil === 'tr' ? 'tr' : 'en'), 540, 1215);
  c.toBlob(async function(b){
    var ad = 'felsefe-' + yer.id + '.png';
    try { var dosya = new File([b], ad, { type:'image/png' }); if (navigator.canShare && navigator.canShare({ files:[dosya] })){ await navigator.share({ files:[dosya], title:t('baslik') }); return; } } catch(e){ if (e && e.name === 'AbortError') return; }
    var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = ad; document.body.appendChild(a); a.click(); a.remove();
  }, 'image/png');
}

/* ==========================================================================
   OLAYLAR
   ========================================================================== */
function sec(id, odakla){
  D.secili = id;
  var yer = bul(id);
  try { history.replaceState(null, '', id ? '#' + id : location.pathname); } catch(e){}
  listeCiz(); panelCiz(!!odakla); metinCiz(); haritayaGuncelle();
  if (yer && D.zum === 'tum' && egede(yer) && odakla !== 'harita') zumla('ege'); else haritaCiz();
}
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-sekme],[data-yer],[data-dil],[data-eylem],[data-rota],#z-tum,#z-ege,#z-bag,#z-rota,#ege-kutu,#ege-kume');
  if (!el) return;
  if (el.hasAttribute('data-sekme')){ sesDurdur(); D.sekme = el.getAttribute('data-sekme'); yaz('fh-sekme', D.sekme); panelCiz(); var sb = document.querySelector('.sekmeler'); if (sb && sb.getBoundingClientRect().top < 0) sb.scrollIntoView({ block:'start' }); return; }
  if (el.id === 'z-bag'){ D.bag = !D.bag; yaz('fh-bag', D.bag); haritaCiz(); metinCiz(); return; }
  if (el.hasAttribute('data-rota')){ D.rotaSec = el.getAttribute('data-rota'); rotaBolumCiz(); if (D.rota){ D.rota = null; rotaGoster(D.rotaSec); } return; }
  if (el.id === 'z-rota'){ rotaGoster(D.rota); return; }
  if (el.id === 'z-tum'){ zumla('tum'); return; }
  if (el.id === 'z-ege' || el.id === 'ege-kutu' || el.id === 'ege-kume'){ zumla('ege'); return; }
  if (el.hasAttribute('data-dil')){ sesDurdur(); D.dil = el.getAttribute('data-dil'); yaz('fh-dil', D.dil); hepsi(); return; }
  if (el.hasAttribute('data-yer')){ sesDurdur(); sec(el.getAttribute('data-yer'), el.closest('#harita') ? 'harita' : true); return; }
  var ey = el.getAttribute('data-eylem');
  if (ey === 'otel') return;
  if (ey === 'rota-goster'){ rotaGoster(D.rotaSec); return; }
  if (ey === 'rotalar'){ $('rota-bolum').scrollIntoView({ behavior:'smooth', block:'start' }); return; }
  if (ey === 'ege'){ zumla('ege'); if (window.matchMedia('(max-width:900px)').matches) $('harita').scrollIntoView({ behavior:'smooth', block:'start' }); return; }
  if (ey === 'rastgele'){ var digerleri = YERLER.filter(function(x){ return x.id !== D.secili; }); sesDurdur(); sec(digerleri[Math.floor(Math.random() * digerleri.length)].id, true); return; }
  if (ey === 'muhur'){ D.muhur[D.secili] = new Date().toLocaleDateString(D.dil === 'tr' ? 'tr-TR' : 'en-GB'); yaz('fh-muhur', D.muhur); bildir(t('muhurBildir')); hepsi(); }
  else if (ey === 'kart') kartYap();
  else if (ey === 'ses') seslendir();
  else if (ey === 'not'){ var v = ($('not-alan').value || '').trim().slice(0, 500); if (v) D.notlar[D.secili] = v; else delete D.notlar[D.secili]; yaz('fh-not', D.notlar); bildir(t('kaydedildi')); }
});
document.addEventListener('keydown', function(e){
  if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'ege-kume'){ e.preventDefault(); zumla('ege'); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g.pin')){ e.preventDefault(); sec(e.target.getAttribute('data-yer'), 'harita'); }
});
/* Masaüstünde haritaya hafif üç boyutlu eğim: fareyle birlikte birkaç derece döner */
(function(){
  var hk = $('harita');
  if (!window.matchMedia || !matchMedia('(hover:hover) and (pointer:fine)').matches || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  hk.addEventListener('mousemove', function(e){ var b = hk.getBoundingClientRect(), x = (e.clientX - b.left) / b.width - .5, yy = (e.clientY - b.top) / b.height - .5;
    hk.style.transform = 'perspective(1600px) rotateX(' + (-yy * 4).toFixed(2) + 'deg) rotateY(' + (x * 5).toFixed(2) + 'deg)'; });
  hk.addEventListener('mouseleave', function(){ hk.style.transform = ''; });
})();
/* Telefonda: harita ekrandan çıkınca "Harita" düğmesi */
var haritaGorunur = true;
function haritayaGuncelle(){ var b = $('haritaya'); if (b) b.hidden = haritaGorunur || !D.secili; }
if ('IntersectionObserver' in window) new IntersectionObserver(function(g){ haritaGorunur = g[0].isIntersecting; haritayaGuncelle(); }).observe($('harita'));
$('haritaya').addEventListener('click', function(){ $('harita').scrollIntoView({ behavior:'smooth', block:'start' }); });
window.addEventListener('resize', function(){ clearTimeout(haritaCiz.z); haritaCiz.z = setTimeout(haritaCiz, 150); });
window.addEventListener('hashchange', function(){ var id = location.hash.slice(1); if (bul(id) && id !== D.secili) sec(id, true); });

(function(){ var id = location.hash.slice(1); if (bul(id)){ D.secili = id; if (egede(bul(id))) D.zum = 'ege'; } hepsi(); })();
if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('/sw.js').catch(function(){}); });
</script>
