      /* amazon.com kimliği yoksa İngilizce görünümde de Amazon.com.tr kullanılır (komisyon gelen tek Amazon hesabı) */
      var s = (dil === 'en' && O.kitap && O.kitap.amazon && O.kitap.amazon.tag) ? 'amazon' : 'amazonTr';
      if (!(O.kitap && O.kitap[s] && O.kitap[s].goster)) return '';
      ana = O.urunAdres(s, u.sorgu[dil]);
      gorsel = '<div class="esya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IKON[u.ikon] + '</svg></div>';
      ad = u.ad[dil]; not = u.not[dil]; rozet = O.kitapAd[s];
    }
    return '<article class="kart"><a class="kart-ana" href="' + h(ana) + '" target="_blank" rel="sponsored noopener"><div class="kart-gorsel">' + gorsel + '<span class="rozet-mag">' + h(rozet) + '</span></div><b>' + h(ad) + '</b><small>' + h(not) + '</small></a>' +
      (magazalar.length > 1 ? '<div class="magazalar">' + magazalar.join('') + '</div>' : '') + '</article>';
  }

  var secili = (location.hash || '').slice(1);
  function ciz(){
    var t = T[dil]; kullanilanFoto = {};
    document.documentElement.lang = dil;
    $('baslik').textContent = t.baslik; $('giris').textContent = t.giris; $('aciklama').textContent = t.aciklama;
    $('n-harita').textContent = t.harita; $('n-yerler').textContent = t.yerler; $('n-rehber').textContent = t.rehberler;
    $('kredi-bas').textContent = t.kredi; $('alt').textContent = t.alt;
    if (!KOLEKSIYONLAR.some(function(k){ return k.id === secili; })) secili = '';
    $('cipler').innerHTML = '<button type="button" data-kol="">' + h(t.hepsi) + '</button>' + KOLEKSIYONLAR.map(function(k){
      return '<button type="button" data-kol="' + k.id + '">' + h(k.ad[dil]) + '</button>';
    }).join('');
    $('koleksiyonlar').innerHTML = KOLEKSIYONLAR.map(function(k){
      var kartlar = k.urunler.map(function(u){ return kart(k, u); }).filter(Boolean);
      if (!kartlar.length) return '';
      return '<section class="koleksiyon" id="' + k.id + '" data-kol-id="' + k.id + '"><div class="kol-bas"><h2>' + h(k.ad[dil]) + '</h2><span>' + h(t.adet.replace('{n}', kartlar.length)) + '</span></div><p class="kol-alt">' + h(k.alt[dil]) + '</p><div class="izgara">' + kartlar.join('') + '</div></section>';
    }).join('');
    $('kredi').innerHTML = h(t.foto) + ' ' + Object.keys(kullanilanFoto).map(function(x){
      var p = kullanilanFoto[x];
      return '<a href="' + h(p.kaynak) + '" target="_blank" rel="noopener">' + h(p.baslik[dil] || p.baslik.en) + '</a>, ' + h(p.yazar) + ' (<a href="' + h(p.lisansUrl || p.kaynak) + '" target="_blank" rel="noopener">' + h(p.lisans) + '</a>)';
    }).join(' · ');
    document.querySelectorAll('[data-dil]').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-dil') === dil); });
    sec(secili, false);
  }
  /* Bir koleksiyon seçilince yalnızca o görünür; adres #tours gibi olur, biyografiye doğrudan koleksiyon bağlantısı konabilir. */
  function sec(id, kaydir){
    secili = id;
    document.querySelectorAll('[data-kol]').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-kol') === id); });
    document.querySelectorAll('.koleksiyon').forEach(function(s){ s.hidden = !!id && s.getAttribute('data-kol-id') !== id; });
    try { history.replaceState(null, '', id ? '#' + id : location.pathname); } catch(x){}
    var c = document.querySelector('[data-kol="' + id + '"]'); if (c && c.scrollIntoView) c.scrollIntoView({ block:'nearest', inline:'center' });
    if (kaydir){ var y = $('cipler').offsetTop; if (window.scrollY > y) window.scrollTo(0, y); }
  }
  document.addEventListener('click', function(e){
    var k = e.target.closest('[data-kol]'); if (k){ sec(k.getAttribute('data-kol'), true); return; }
    var b = e.target.closest('[data-dil]'); if (!b) return;
    dil = b.getAttribute('data-dil'); try { localStorage.setItem('fh-dil', JSON.stringify(dil)); } catch(x){} ciz();
  });
  window.addEventListener('hashchange', function(){ var id = (location.hash || '').slice(1); sec(KOLEKSIYONLAR.some(function(k){ return k.id === id; }) ? id : '', false); });
  ciz();
})();
</script>
</body>
</html>
