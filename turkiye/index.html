<title>Türkiye Felsefe Haritası</title>
<meta name="description" content="Anadolu'da felsefenin doğduğu ve yaşadığı on yer: Efes'ten Konya'ya rota, söz kartları ve felsefe pasaportu.">

<meta property="og:type" content="website">
<meta property="og:locale" content="tr_TR">
<meta property="og:title" content="Türkiye Felsefe Haritası">
<meta property="og:description" content="Herakleitos'tan Mevlânâ'ya, Anadolu'da felsefenin izinde on durak.">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Efes platformuyla aynı dil: mermer, Ege mavisi, pişmiş toprak, okra. Harita solda, ayrıntı sağda; telefonda alt alta. */
:root{
  --mermer:#F4F1EA; --tas:#E9E2D3; --cizgi:#D8CFBC; --murekkep:#1C2A3A; --soluk:#4A5868;
  --ege:#1F5C8A; --ege-acik:#9EC3DE; --deniz:#DCE7EE; --deniz-cizgi:#C3D5E1; --toprak:#A0561F; --okra:#E3B38A;
  --gece:#14202C; --gece-yuzey:#24344A; --gece-soluk:#C3CEDA;
  --kara:#EFE7D6; --kara-cizgi:#B9A88A; --komsu:#E6E3DA;
  --yazi:'EB Garamond','Garamond','Iowan Old Style',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--mermer);color:var(--murekkep)}
body{font-family:var(--yazi);font-size:18px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ege)}
:focus-visible{outline:2px solid var(--toprak);outline-offset:2px}
.gizli{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.etiket{font-size:14px;letter-spacing:.22em;font-weight:600;color:var(--toprak);text-transform:uppercase}
h1{font-weight:600;font-size:clamp(32px,5vw,48px);line-height:1.05;margin:4px 0 6px;text-wrap:balance}
h2{font-weight:600;font-size:28px;line-height:1.1;margin:0}
h3{font-weight:600;font-size:20px;margin:0}
p{margin:0}
.soluk{color:var(--soluk)}
.not{font-size:15px;color:var(--soluk)}

header.ust{max-width:1240px;margin:0 auto;padding:28px 16px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.dil{display:flex;border:1.5px solid var(--cizgi);border-radius:12px;overflow:hidden;flex:none}
.dil button{border:0;background:transparent;padding:6px 12px;font-weight:600;font-size:15px;min-height:40px}
.dil button[aria-pressed="true"]{background:var(--murekkep);color:var(--mermer)}

main{max-width:1240px;margin:0 auto;padding:0 16px 48px;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;align-items:start}
@media (max-width:900px){ main{grid-template-columns:minmax(0,1fr)} }

/* harita */
.harita-kutu{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
@media (max-width:900px){ .harita-kutu{position:static} }
.harita{position:relative;background:var(--deniz);border-radius:22px;overflow:hidden;border:1px solid var(--deniz-cizgi)}
.harita svg{display:block;width:100%;height:auto;touch-action:manipulation}
.harita .kara{fill:var(--kara);stroke:var(--kara-cizgi);stroke-width:1.2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.harita .komsu{fill:var(--komsu);stroke:#CFC9BB;stroke-width:.8;vector-effect:non-scaling-stroke}
.harita .dalga{fill:none;stroke:var(--deniz-cizgi);stroke-width:1;stroke-linecap:round}
.harita .deniz-ad{font-style:italic;fill:#6E8BA2;letter-spacing:.3em;font-size:14px}
.pin{cursor:pointer}
.pin .halka{fill:var(--toprak);stroke:#fff}
.pin text{fill:#fff;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin .ad{fill:var(--murekkep);font-weight:600;text-anchor:start;paint-order:stroke;stroke:var(--kara);stroke-linejoin:round}
.pin.muhurlu .halka{fill:var(--ege)}
.pin.secili .halka{fill:var(--murekkep)}
.pin .nabiz{fill:none;stroke:var(--toprak);opacity:0}
.pin.secili .nabiz{animation:nabiz 1.8s ease-out infinite}
@keyframes nabiz{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
.pin .nabiz{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){ .pin.secili .nabiz{animation:none} }
.ege-kutu{fill:rgba(31,92,138,.06);stroke:var(--ege);stroke-dasharray:4 4;cursor:pointer;vector-effect:non-scaling-stroke}
.harita-araclar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cip{min-height:44px;border-radius:14px;border:1.5px solid var(--cizgi);background:#fff;padding:0 14px;font-weight:600;font-size:16px}
.cip[aria-pressed="true"]{background:var(--ege);border-color:var(--ege);color:#fff}

/* liste */
.liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.yer-btn{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:1.5px solid transparent;border-radius:16px;padding:10px 12px;min-height:64px}
.yer-btn[aria-current="true"]{border-color:var(--murekkep)}
.yer-btn .no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--toprak);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.yer-btn.muhurlu .no{background:var(--ege)}
.yer-btn b{display:block;font-size:17px;line-height:1.2}
.yer-btn small{display:block;font-size:14.5px;color:var(--soluk);line-height:1.25}

/* ayrıntı paneli */
.panel{background:#fff;border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:18px;border:1px solid var(--cizgi)}
.panel-bas{display:flex;gap:14px;align-items:center}
.amblem{flex:none;width:76px;height:76px;border-radius:50%;background:var(--mermer);display:grid;place-items:center;color:var(--toprak)}
.amblem svg{width:52px;height:52px}
.bilgi-satir{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15.5px;color:var(--soluk)}
.soz{background:var(--gece);color:var(--mermer);border-radius:18px;padding:20px 20px 16px;display:flex;flex-direction:column;gap:10px}
.soz blockquote{margin:0;font-size:23px;line-height:1.3;font-style:italic;text-wrap:pretty}
.soz .kaynak{font-size:15px;color:var(--gece-soluk)}
.soz .rozet{align-self:flex-start;font-size:13px;letter-spacing:.06em;border-radius:999px;padding:2px 10px;background:rgba(227,179,138,.18);color:var(--okra)}
.soz .rozet.dogru{background:rgba(143,209,168,.16);color:#8FD1A8}
.soz-eylem{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:0;font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-ege{background:var(--ege);color:#fff}
.btn-okra{background:var(--okra);color:var(--gece)}
.btn-koyu{background:var(--murekkep);color:var(--mermer)}
.btn-hayalet{background:transparent;border:1.5px solid var(--cizgi);color:var(--murekkep)}
.soz .btn-hayalet{border-color:#36495F;color:var(--mermer)}
.rota{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;counter-reset:d}
.rota li{position:relative;padding:0 0 14px 34px;counter-increment:d}
.rota li::before{content:counter(d);position:absolute;left:0;top:2px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--toprak);color:var(--toprak);font-size:13px;font-weight:700;display:grid;place-items:center}
.rota li::after{content:"";position:absolute;left:11px;top:26px;bottom:2px;border-left:1.5px dashed var(--cizgi)}
.rota li:last-child::after{display:none}
.rota b{display:block;font-size:17px}
.rota span{font-size:15.5px;color:var(--soluk)}
.muhur-kutu{display:flex;gap:14px;align-items:center;background:var(--mermer);border-radius:18px;padding:12px 14px}
.muhur-kutu svg{flex:none;width:84px;height:84px}
.otel{border:1.5px solid var(--cizgi);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.kaynaklar{font-size:15px;display:flex;flex-wrap:wrap;gap:4px 14px}

/* pasaport */
.pasaport-bolum{max-width:1240px;margin:0 auto;padding:8px 16px 56px}
.pasaport{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px;background:#fff;border:1px solid var(--cizgi);border-radius:22px;padding:20px;margin-top:12px}
.pasaport button{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14.5px;color:var(--soluk)}
.pasaport svg{width:104px;height:104px}
.pasaport button:nth-child(3n) .basili{transform:rotate(6deg)}
.pasaport button:nth-child(3n+1) .basili{transform:rotate(-5deg)}
.yakinda{margin-top:18px;font-size:15.5px;color:var(--soluk)}
footer{max-width:1240px;margin:0 auto;padding:0 16px 40px;font-size:14.5px;color:var(--soluk);display:flex;flex-direction:column;gap:6px}
.bildirim{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--murekkep);color:var(--mermer);border-radius:14px;padding:10px 16px;font-size:16px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.bildirim.acik{opacity:1}
</style>
</head>
<body>
<header class="ust">
  <div>
    <div class="etiket" id="ust-etiket"></div>
    <h1 id="baslik"></h1>
    <p class="soluk" id="giris"></p>
  </div>
  <div class="dil" role="group" aria-label="Dil / Language">
    <button type="button" data-dil="tr">TR</button><button type="button" data-dil="en">EN</button>
  </div>
</header>

<main>
  <div class="harita-kutu">
    <div class="harita" id="harita"></div>
    <div class="harita-araclar">
      <button type="button" class="cip" id="z-tum"></button>
      <button type="button" class="cip" id="z-ege"></button>
      <span class="not" id="harita-not"></span>
    </div>
    <div class="liste" id="liste"></div>
  </div>
  <section class="panel" id="panel" aria-live="polite" tabindex="-1"></section>
</main>

<section class="pasaport-bolum" id="pasaport-bolum"></section>

<footer id="alt"></footer>
<div class="bildirim" id="bildirim" role="status"></div>

      '<p class="kaynak">' + h(kaynak) + '</p>' +
      '<span class="rozet' + (s.dogrulandi ? ' dogru' : '') + '">' + h(s.dogrulandi ? t('dogru') : t('bekliyor')) + '</span>' +
      '<div class="soz-eylem"><button type="button" class="btn btn-hayalet" data-eylem="kart">' + h(t('kartYap')) + '</button></div></div>' +
    '<div><div class="etiket" style="margin-bottom:10px">' + h(t('rota')) + '</div><ol class="rota">' + m.rota.map(function(r){ return '<li><b>' + h(r[0]) + '</b><span>' + h(r[1]) + '</span></li>'; }).join('') + '</ol></div>' +
    '<div class="muhur-kutu">' + muhurSVG(yer, muhurlu) + '<div style="display:flex;flex-direction:column;gap:8px"><p class="not">' + h(muhurlu ? t('muhurlu') + ' · ' + D.muhur[yer.id] : t('muhurNot')) + '</p>' +
      (muhurlu ? '' : '<button type="button" class="btn btn-okra" data-eylem="muhur">' + h(t('muhur')) + '</button>') + '</div></div>' +
    otel +
    '<div><div class="etiket" style="margin-bottom:6px">' + h(t('kaynaklar')) + '</div><div class="kaynaklar">' + yer.kaynaklar.map(function(k){ return '<a href="' + k[1] + '" target="_blank" rel="noopener">' + h(k[0]) + '</a>'; }).join('') + '</div></div>';
  if (odakla && window.matchMedia('(max-width:900px)').matches) p.scrollIntoView({ behavior:'smooth', block:'start' });
}

function pasaportCiz(){
  var n = YERLER.filter(function(yer){ return D.muhur[yer.id]; }).length;
  $('pasaport-bolum').innerHTML = '<div class="etiket">ΔΙΑΒΑΤΗΡΙΟΝ</div><h2>' + h(t('pasaport')) + ' · ' + n + ' / ' + YERLER.length + '</h2><p class="soluk">' + h(t('pasaportAlt')) + '</p>' +
    '<div class="pasaport">' + YERLER.map(function(yer){ return '<button type="button" data-yer="' + yer.id + '">' + muhurSVG(yer, !!D.muhur[yer.id]) + '<span>' + h(y(yer).ad) + '</span></button>'; }).join('') + '</div>' +
    '<p class="yakinda">' + h(t('yakinda')) + '</p>';
}

function metinCiz(){
  document.documentElement.lang = D.dil;
  document.title = t('baslik');
  $('ust-etiket').textContent = t('etiket'); $('baslik').textContent = t('baslik'); $('giris').textContent = t('giris');
  $('z-tum').textContent = t('tum'); $('z-ege').textContent = t('ege'); $('harita-not').textContent = D.zum === 'tum' ? t('egeNot') : '';
  $('alt').innerHTML = '<p>' + h(t('alt1')) + '</p><p>' + h(t('alt2')) + '</p>';
  document.querySelectorAll('[data-dil]').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-dil') === D.dil); });
}
function hepsi(odakla){ metinCiz(); haritaCiz(); listeCiz(); panelCiz(odakla); pasaportCiz(); }

/* ==========================================================================
   SÖZ KARTI (1080x1350 PNG, paylaşılabilir)
   ========================================================================== */
function satirlara(ctx, metin, gen){
  var kel = metin.split(' '), sat = [], s = '';
  kel.forEach(function(k){ var d = s ? s + ' ' + k : k; if (ctx.measureText(d).width > gen && s){ sat.push(s); s = k; } else s = d; });
  if (s) sat.push(s); return sat;
}
function amblemResmi(id){
  return new Promise(function(ok){
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" fill="none" stroke="#E3B38A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#E3B38A">' + AMBLEM[id] + '</svg>';
    var img = new Image(); img.onload = function(){ ok(img); }; img.onerror = function(){ ok(null); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
async function kartYap(){
  var yer = bul(D.secili); if (!yer) return;
  try { await document.fonts.ready; } catch(e){}
  var c = document.createElement('canvas'); c.width = 1080; c.height = 1350;
  var x = c.getContext('2d'), s = yer.soz, F = '"EB Garamond", Georgia, serif';
  x.fillStyle = '#14202C'; x.fillRect(0, 0, 1080, 1350);
  x.strokeStyle = '#36495F'; x.lineWidth = 3; x.strokeRect(48, 48, 984, 1254);
  var img = await amblemResmi(yer.id); if (img) x.drawImage(img, 412, 120, 256, 256);
  x.fillStyle = '#E3B38A'; x.textAlign = 'center'; x.font = '600 34px ' + F;
  x.fillText(yer.yunan.split('').join(' '), 540, 440);
  x.fillStyle = '#F4F1EA'; x.font = (s.eser ? '600 ' : 'italic 500 ') + '64px ' + F;
  var metin = s.eser ? s[D.dil] : '“' + s[D.dil] + '”', sat = satirlara(x, metin, 860), yuk = 82, y0 = 700 - (sat.length - 1) * yuk / 2;
  sat.forEach(function(l, i){ x.fillText(l, 540, y0 + i * yuk); });
  x.fillStyle = '#C3CEDA'; x.font = '400 32px ' + F;
  satirlara(x, (D.dil === 'en' && s.kaynakEn) ? s.kaynakEn : s.kaynak, 860).forEach(function(l, i){ x.fillText(l, 540, y0 + sat.length * yuk + 30 + i * 42); });
  x.fillStyle = '#E3B38A'; x.font = '600 30px ' + F; x.fillText(t('kartAlt') + ' · ' + y(yer).ad, 540, 1240);
  c.toBlob(async function(b){
    var ad = 'felsefe-' + yer.id + '.png';
    try { var dosya = new File([b], ad, { type:'image/png' }); if (navigator.canShare && navigator.canShare({ files:[dosya] })){ await navigator.share({ files:[dosya], title:t('baslik') }); return; } } catch(e){ if (e && e.name === 'AbortError') return; }
    var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = ad; document.body.appendChild(a); a.click(); a.remove();
  }, 'image/png');
}

/* ==========================================================================
   OLAYLAR
   ========================================================================== */
function sec(id, odakla){
  D.secili = id;
  var yer = bul(id);
  if (yer && D.zum === 'tum' && egede(yer) && odakla !== 'harita') D.zum = 'ege';
  try { history.replaceState(null, '', id ? '#' + id : location.pathname); } catch(e){}
  haritaCiz(); listeCiz(); panelCiz(!!odakla); metinCiz();
}
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-yer],[data-dil],[data-eylem],#z-tum,#z-ege,#ege-kutu,#ege-kume');
  if (!el) return;
  if (el.id === 'z-tum'){ D.zum = 'tum'; haritaCiz(); metinCiz(); return; }
  if (el.id === 'z-ege' || el.id === 'ege-kutu' || el.id === 'ege-kume'){ D.zum = 'ege'; haritaCiz(); metinCiz(); return; }
  if (el.hasAttribute('data-dil')){ D.dil = el.getAttribute('data-dil'); yaz('fh-dil', D.dil); hepsi(); return; }
  if (el.hasAttribute('data-yer')){ sec(el.getAttribute('data-yer'), el.closest('#harita') ? 'harita' : true); return; }
  var ey = el.getAttribute('data-eylem');
  if (ey === 'muhur'){ D.muhur[D.secili] = new Date().toLocaleDateString(D.dil === 'tr' ? 'tr-TR' : 'en-GB'); yaz('fh-muhur', D.muhur); bildir(t('muhurBildir')); hepsi(); }
  else if (ey === 'kart') kartYap();
});
document.addEventListener('keydown', function(e){
  if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'ege-kume'){ e.preventDefault(); D.zum = 'ege'; haritaCiz(); metinCiz(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g.pin')){ e.preventDefault(); sec(e.target.getAttribute('data-yer'), 'harita'); }
});
window.addEventListener('resize', function(){ clearTimeout(haritaCiz.z); haritaCiz.z = setTimeout(haritaCiz, 150); });
window.addEventListener('hashchange', function(){ var id = location.hash.slice(1); if (bul(id) && id !== D.secili) sec(id, true); });

(function(){ var id = location.hash.slice(1); if (bul(id)){ D.secili = id; if (egede(bul(id))) D.zum = 'ege'; } hepsi(); })();
</script>
