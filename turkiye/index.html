<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Türkiye Felsefe Haritası</title>
<meta name="description" content="Anadolu'da felsefenin doğduğu ve yaşadığı on yer: Efes'ten Konya'ya rota, söz kartları ve felsefe pasaportu.">
<meta name="theme-color" content="#1C2A3A">
<meta property="og:type" content="website">
<meta property="og:locale" content="tr_TR">
<meta property="og:title" content="Türkiye Felsefe Haritası">
<meta property="og:description" content="Herakleitos'tan Mevlânâ'ya, Anadolu'da felsefenin izinde on durak.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231C2A3A'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Georgia,serif' font-size='40' fill='%23E3B38A'%3EΦ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Efes platformuyla aynı dil: mermer, Ege mavisi, pişmiş toprak, okra. Harita solda, ayrıntı sağda; telefonda alt alta. */
:root{
  --mermer:#F4F1EA; --tas:#E9E2D3; --cizgi:#D8CFBC; --murekkep:#1C2A3A; --soluk:#4A5868;
  --ege:#1F5C8A; --ege-acik:#9EC3DE; --deniz:#DCE7EE; --deniz-cizgi:#C3D5E1; --toprak:#A0561F; --okra:#E3B38A;
  --gece:#14202C; --gece-yuzey:#24344A; --gece-soluk:#C3CEDA;
  --kara:#EFE7D6; --kara-cizgi:#B9A88A; --komsu:#E6E3DA;
  --yazi:'EB Garamond','Garamond','Iowan Old Style',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--mermer);color:var(--murekkep)}
body{font-family:var(--yazi);font-size:18px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ege)}
:focus-visible{outline:2px solid var(--toprak);outline-offset:2px}
.gizli{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.etiket{font-size:14px;letter-spacing:.22em;font-weight:600;color:var(--toprak);text-transform:uppercase}
h1{font-weight:600;font-size:clamp(32px,5vw,48px);line-height:1.05;margin:4px 0 6px;text-wrap:balance}
h2{font-weight:600;font-size:28px;line-height:1.1;margin:0}
h3{font-weight:600;font-size:20px;margin:0}
p{margin:0}
.soluk{color:var(--soluk)}
.not{font-size:15px;color:var(--soluk)}

header.ust{max-width:1240px;margin:0 auto;padding:28px 16px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.dil{display:flex;border:1.5px solid var(--cizgi);border-radius:12px;overflow:hidden;flex:none}
.dil button{border:0;background:transparent;padding:6px 12px;font-weight:600;font-size:15px;min-height:40px}
.dil button[aria-pressed="true"]{background:var(--murekkep);color:var(--mermer)}

main{max-width:1240px;margin:0 auto;padding:0 16px 48px;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;align-items:start}
@media (max-width:900px){ main{grid-template-columns:minmax(0,1fr)} }

/* harita */
.harita-kutu{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
@media (max-width:900px){ .harita-kutu{position:static} }
.harita{position:relative;background:var(--deniz);border-radius:22px;overflow:hidden;border:1px solid var(--deniz-cizgi)}
.harita svg{display:block;width:100%;height:auto;touch-action:manipulation}
.harita .kara{fill:var(--kara);stroke:var(--kara-cizgi);stroke-width:1.2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.harita .komsu{fill:var(--komsu);stroke:#CFC9BB;stroke-width:.8;vector-effect:non-scaling-stroke}
.harita .dalga{fill:none;stroke:var(--deniz-cizgi);stroke-width:1;stroke-linecap:round}
.harita .deniz-ad{font-style:italic;fill:#6E8BA2;letter-spacing:.3em;font-size:14px}
.pin{cursor:pointer}
.pin .halka{fill:var(--toprak);stroke:#fff}
.pin text{fill:#fff;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin .ad{fill:var(--murekkep);font-weight:600;text-anchor:start;paint-order:stroke;stroke:var(--kara);stroke-linejoin:round}
.pin.muhurlu .halka{fill:var(--ege)}
.pin.secili .halka{fill:var(--murekkep)}
.pin .nabiz{fill:none;stroke:var(--toprak);opacity:0}
.pin.secili .nabiz{animation:nabiz 1.8s ease-out infinite}
@keyframes nabiz{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
.pin .nabiz{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){ .pin.secili .nabiz{animation:none} }
.bag path{fill:none;stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linecap:round}
.bag polygon{stroke:none}
.bag.hoca path{stroke:var(--ege)} .bag.hoca polygon{fill:var(--ege)}
.bag.etki path{stroke:var(--toprak);stroke-dasharray:5 5} .bag.etki polygon{fill:var(--toprak)}
.bag{opacity:.7;transition:opacity .2s}
.bag.ilgili{opacity:1} .bag.ilgili path{stroke-width:2.6}
.bag.soluk{opacity:.12}
.bag-liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.bag-liste button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--mermer);border:0;border-radius:14px;padding:10px 12px}
.bag-liste .cizgi{flex:none;width:26px;margin-top:12px;border-top:2px solid var(--ege)}
.bag-liste .etki .cizgi{border-top:2px dashed var(--toprak)}
.bag-liste b{display:block;font-size:16.5px}
.bag-liste span{font-size:15px;color:var(--soluk)}
.dinle-metin{font-size:17px}
.dusun{background:var(--mermer);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.dusun p.soru{font-size:19px;font-style:italic}
.dusun textarea{width:100%;min-height:72px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--cizgi);background:#fff;font:inherit;font-size:16px;resize:vertical}
.soz .ozgun{font-size:17px;color:var(--gece-soluk);direction:rtl;text-align:right}
.ege-kutu{fill:rgba(31,92,138,.06);stroke:var(--ege);stroke-dasharray:4 4;cursor:pointer;vector-effect:non-scaling-stroke}
.harita-araclar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cip{min-height:44px;border-radius:14px;border:1.5px solid var(--cizgi);background:#fff;padding:0 14px;font-weight:600;font-size:16px}
.cip[aria-pressed="true"]{background:var(--ege);border-color:var(--ege);color:#fff}

/* liste */
.liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.yer-btn{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:1.5px solid transparent;border-radius:16px;padding:10px 12px;min-height:64px}
.yer-btn[aria-current="true"]{border-color:var(--murekkep)}
.yer-btn .no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--toprak);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.yer-btn.muhurlu .no{background:var(--ege)}
.yer-btn b{display:block;font-size:17px;line-height:1.2}
.yer-btn small{display:block;font-size:14.5px;color:var(--soluk);line-height:1.25}

/* ayrıntı paneli */
.panel{background:#fff;border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:18px;border:1px solid var(--cizgi)}
.panel-bas{display:flex;gap:14px;align-items:center}
.amblem{flex:none;width:76px;height:76px;border-radius:50%;background:var(--mermer);display:grid;place-items:center;color:var(--toprak)}
.amblem svg{width:52px;height:52px}
.bilgi-satir{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15.5px;color:var(--soluk)}
.soz{background:var(--gece);color:var(--mermer);border-radius:18px;padding:20px 20px 16px;display:flex;flex-direction:column;gap:10px}
.soz blockquote{margin:0;font-size:23px;line-height:1.3;font-style:italic;text-wrap:pretty}
.soz .kaynak{font-size:15px;color:var(--gece-soluk)}
.soz .rozet{align-self:flex-start;font-size:13px;letter-spacing:.06em;border-radius:999px;padding:2px 10px;background:rgba(227,179,138,.18);color:var(--okra)}
.soz .rozet.dogru{background:rgba(143,209,168,.16);color:#8FD1A8}
.soz-eylem{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:0;font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-ege{background:var(--ege);color:#fff}
.btn-okra{background:var(--okra);color:var(--gece)}
.btn-koyu{background:var(--murekkep);color:var(--mermer)}
.btn-hayalet{background:transparent;border:1.5px solid var(--cizgi);color:var(--murekkep)}
.soz .btn-hayalet{border-color:#36495F;color:var(--mermer)}
.rota{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;counter-reset:d}
.rota li{position:relative;padding:0 0 14px 34px;counter-increment:d}
.rota li::before{content:counter(d);position:absolute;left:0;top:2px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--toprak);color:var(--toprak);font-size:13px;font-weight:700;display:grid;place-items:center}
.rota li::after{content:"";position:absolute;left:11px;top:26px;bottom:2px;border-left:1.5px dashed var(--cizgi)}
.rota li:last-child::after{display:none}
.rota b{display:block;font-size:17px}
.rota span{font-size:15.5px;color:var(--soluk)}
.muhur-kutu{display:flex;gap:14px;align-items:center;background:var(--mermer);border-radius:18px;padding:12px 14px}
.muhur-kutu svg{flex:none;width:84px;height:84px}
.otel{border:1.5px solid var(--cizgi);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.kaynaklar{font-size:15px;display:flex;flex-wrap:wrap;gap:4px 14px}

/* pasaport */
.pasaport-bolum{max-width:1240px;margin:0 auto;padding:8px 16px 56px}
.pasaport{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px;background:#fff;border:1px solid var(--cizgi);border-radius:22px;padding:20px;margin-top:12px}
.pasaport button{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14.5px;color:var(--soluk)}
.pasaport svg{width:104px;height:104px}
.pasaport button:nth-child(3n) .basili{transform:rotate(6deg)}
.pasaport button:nth-child(3n+1) .basili{transform:rotate(-5deg)}
.yakinda{margin-top:18px;font-size:15.5px;color:var(--soluk)}
footer{max-width:1240px;margin:0 auto;padding:0 16px 40px;font-size:14.5px;color:var(--soluk);display:flex;flex-direction:column;gap:6px}
.bildirim{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--murekkep);color:var(--mermer);border-radius:14px;padding:10px 16px;font-size:16px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.bildirim.acik{opacity:1}
</style>
</head>
<body>
<header class="ust">
  <div>
    <div class="etiket" id="ust-etiket"></div>
    <h1 id="baslik"></h1>
    <p class="soluk" id="giris"></p>
  </div>
  <div class="dil" role="group" aria-label="Dil / Language">
    <button type="button" data-dil="tr">TR</button><button type="button" data-dil="en">EN</button>
  </div>
</header>

<main>
  <div class="harita-kutu">
    <div class="harita" id="harita"></div>
    <div class="harita-araclar">
      <button type="button" class="cip" id="z-tum"></button>
      <button type="button" class="cip" id="z-ege"></button>
      <button type="button" class="cip" id="z-bag"></button>
      <span class="not" id="harita-not"></span>
    </div>
    <div class="liste" id="liste"></div>
  </div>
  <section class="panel" id="panel" aria-live="polite" tabindex="-1"></section>
</main>

<section class="pasaport-bolum" id="pasaport-bolum"></section>

<footer id="alt"></footer>
<div class="bildirim" id="bildirim" role="status"></div>

<script src="harita-veri.js"></script>

var DERIN = {
 efes:{ tr:{ dinle:'Herakleitos MÖ 500 dolaylarında Efes’te yaşadı. Kitabından bugün yalnızca başka yazarların aktardığı parçalar kaldı. Bu parçalarda dünya durmadan değişen bir şeydir: ırmak akar, ateş yanar, gündüz geceye döner. Ama Herakleitos’a göre bu değişim gelişigüzel değildir; her şey bir ölçüye, onun deyişiyle bir logos’a göre olur. Efes’te bunu kendi gözünle görebilirsin: bir zamanlar deniz kıyısında olan bu liman kenti, ırmağın taşıdığı alüvyonla karada kaldı.', soru:'Bugünkü sen ile on yıl önceki sen aynı kişi misiniz? Seni sen yapan ne değişmeden kalıyor?' },
       en:{ dinle:'Heraclitus lived in Ephesus around 500 BC. All that survives of his book are fragments quoted by later writers. In them the world never stands still: the river flows, fire burns, day turns into night. Yet for Heraclitus this change is not random; everything happens according to a measure, what he called the logos. In Ephesus you can see it for yourself: this harbour city once stood on the sea, and the silt carried by the river left it on dry land.', soru:'Are you the same person you were ten years ago? What stays unchanged and makes you you?' } },
 milet:{ tr:{ dinle:'Milet bir zamanlar Ege’nin en zengin liman kentlerinden biriydi. MÖ 6. yüzyılda burada üç düşünür dünyayı tanrıların öyküleriyle değil, doğanın kendisiyle açıklamaya çalıştı. Aristoteles’e göre Thales her şeyin ilkesini suda gördü. Anaksimandros her şeyin kaynağına sınırsız anlamında apeiron dedi. Anaksimenes bu kaynağı havada aradı. Cevapları bugün tuhaf gelebilir, ama sordukları soru hâlâ bizim sorumuz: Bu kadar çeşitli şeyin altında tek bir ilke var mı?', soru:'Sence her şeyin altında tek bir ilke var mı, yoksa dünya gerçekten çok parçalı mı?' },
        en:{ dinle:'Miletus was once one of the richest harbour cities of the Aegean. In the 6th century BC three thinkers here tried to explain the world not through stories of the gods but through nature itself. According to Aristotle, Thales took water to be the principle of all things. Anaximander called the source of everything the apeiron, the boundless. Anaximenes looked for it in air. Their answers may sound strange today, but their question is still ours: is there one principle beneath all this variety?', soru:'Do you think there is one principle beneath everything, or is the world truly made of many?' } },
 klazomenai:{ tr:{ dinle:'Anaksagoras MÖ 500 dolaylarında Klazomenai’de doğdu ve Atina’ya gitti; felsefeyi o kente taşıyan ilk düşünür sayılır. Ona göre her şeyde her şeyden bir pay vardır, evrendeki düzeni ise nous, yani akıl başlatmıştır. Atina’da Güneş’in bir tanrı değil, kızgın bir taş olduğunu söylediği için dinsizlikle suçlandı ve kentten ayrılmak zorunda kaldı.', soru:'Dünyadaki düzen bir aklın işi mi, yoksa kendiliğinden mi ortaya çıkar?' },
        en:{ dinle:'Anaxagoras was born in Clazomenae around 500 BC and moved to Athens; he is counted as the first philosopher to bring philosophy to that city. He held that there is a share of everything in everything, and that the order of the cosmos was set in motion by nous, mind. In Athens he was charged with impiety for saying that the sun was not a god but a burning stone, and he had to leave the city.', soru:'Is the order of the world the work of a mind, or does it arise by itself?' } },
 assos:{ tr:{ dinle:'Platon MÖ 347’de öldüğünde Aristoteles Atina’daki Akademi’den ayrıldı ve Assos’a geldi. Burada yaklaşık üç yıl kaldı, sonra karşıdaki Midilli adasına geçti ve orada canlılar üzerine gözlemler yaptı. Assos’un bir başka çocuğu Kleanthes ise Stoa okulunun ikinci başkanı oldu. Anlatılara göre geceleri su taşıyarak geçimini sağlar, gündüzleri felsefe dinlerdi. Athena Tapınağı’nın önünden Midilli’ye bak: Aristoteles’in gördüğü manzara bu.', soru:'Son zamanlarda neyi gerçekten bilmek istedin? O merak seni nereye götürdü?' },
        en:{ dinle:'When Plato died in 347 BC, Aristotle left the Academy in Athens and came to Assos. He stayed about three years, then crossed to the island of Lesbos opposite, where he studied living things. Another son of Assos, Cleanthes, became the second head of the Stoic school. The story goes that he carried water at night to earn his living and listened to philosophy by day. Look out towards Lesbos from the Temple of Athena: this is the view Aristotle saw.', soru:'What have you truly wanted to know lately? Where did that curiosity lead you?' } },
 bergama:{ tr:{ dinle:'Bergama krallarının kurduğu kütüphane, antik dünyada İskenderiye’dekiyle yarışırdı. Galenos MS 129’da bu kentte doğdu. Gençliğinde farklı felsefe okullarının hocalarından ders aldı, sonra hekim oldu ve gladyatörleri tedavi etti. Daha sonra Roma’da imparatorların hekimi oldu. Ona göre iyi bir hekim mantık bilmeli, doğayı incelemeli ve ahlaklı olmalıydı; yani aynı zamanda filozof olmalıydı.', soru:'Bedenimizin sağlığı ile ruhumuzun sağlığı birbirinden ayrılabilir mi?' },
        en:{ dinle:'The library founded by the kings of Pergamon rivalled the one in Alexandria. Galen was born in this city in 129 AD. As a young man he studied with teachers from different philosophical schools, then became a physician and treated gladiators. Later he became physician to emperors in Rome. For Galen a good doctor had to know logic, study nature and live ethically; in other words, he also had to be a philosopher.', soru:'Can the health of the body be separated from the health of the soul?' } },
 hierapolis:{ tr:{ dinle:'Epiktetos 50’li yıllarda Hierapolis’te köle olarak doğdu. Roma’da özgürlüğüne kavuştu ve Stoa felsefesi öğretmeye başladı. İmparator Domitianus filozofları Roma’dan sürünce Yunanistan’daki Nikopolis’e gitti ve okulunu orada kurdu. Kendisi bir şey yazmadı; derslerini öğrencisi Arrianos not aldı. Öğretisinin özü basittir: elimizde olanla olmayanı ayırmak. Başımıza gelenleri değil, onlar hakkındaki yargılarımızı seçebiliriz.', soru:'Bugün seni üzen bir şeyi düşün. Bunun ne kadarı senin elinde, ne kadarı değil?' },
        en:{ dinle:'Epictetus was born a slave in Hierapolis in the 50s AD. He was freed in Rome and began to teach Stoic philosophy. When the emperor Domitian banished philosophers from Rome, he went to Nicopolis in Greece and founded his school there. He wrote nothing himself; his student Arrian took notes of his lessons. The heart of his teaching is simple: tell apart what is up to us from what is not. We cannot choose what happens to us, only our judgements about it.', soru:'Think of something that upset you today. How much of it was up to you, and how much was not?' } },
 afrodisias:{ tr:{ dinle:'Afrodisias heykel atölyeleriyle ünlü bir Roma kentiydi. Aleksandros MS 2. yüzyılın sonu ile 3. yüzyılın başında yaşadı ve Aristoteles’in en etkili yorumcusu oldu. 2001’de burada bulunan bir yazıt, onu Atina’daki felsefe okullarının başlarından biri olarak anar. Kader Üzerine adlı eserinde, her şey önceden belirlenmişse insanın yaptıklarından nasıl sorumlu tutulabileceğini sordu ve Stoacıların kader anlayışına karşı çıktı.', soru:'Her şey önceden belirlenmiş olsaydı, yaptıkların için seni suçlamak adil olur muydu?' },
        en:{ dinle:'Aphrodisias was a Roman city famous for its sculpture workshops. Alexander lived here in the late 2nd and early 3rd century AD and became the most influential commentator on Aristotle. An inscription found here in 2001 names him as one of the heads of the philosophical schools in Athens. In his treatise On Fate he asked how people could be held responsible if everything were fixed in advance, and argued against the Stoic view of fate.', soru:'If everything were fixed in advance, would it be fair to blame you for what you do?' } },
 sinop:{ tr:{ dinle:'Diogenes MÖ 404 dolaylarında Sinop’ta doğdu. Kentten kaçtı ya da sürgün edildi ve Atina’ya gitti. Orada bir küpün içinde yaşadığı, gündüz elinde bir lambayla “bir insan arıyorum” diye dolaştığı anlatılır. Toplumun alışkanlıklarıyla alay ederek onları sorguladı ve yalnızca doğaya uygun bir hayatın özgür olduğunu savundu. Bu anlatıların çoğu, yüzyıllar sonra Diogenes Laertios’un topladığı anekdotlardır.', soru:'Sahip olduğun şeylerden hangisi olmadan da mutlu olabilirdin?' },
        en:{ dinle:'Diogenes was born in Sinope around 404 BC. He fled or was exiled from the city and went to Athens. There, the stories say, he lived in a large jar and walked about in daylight with a lamp, saying he was looking for a human being. He mocked the habits of society in order to question them, and argued that only a life in accordance with nature is free. Most of these stories are anecdotes collected centuries later by Diogenes Laertius.', soru:'Which of the things you own could you be happy without?' } },
 soli:{ tr:{ dinle:'Khrysippos MÖ 280 dolaylarında Soli’de doğdu. Atina’ya gidip Kleanthes’in öğrencisi oldu ve onun ardından Stoa okulunun başına geçti. Yüzlerce eser yazdığı söylenir, ama hiçbiri bütün olarak günümüze ulaşmadı. Stoa’nın mantığını, doğa anlayışını ve ahlakını bir sistem hâline getirdi; bu yüzden Stoa’nın ikinci kurucusu sayılır. Tarsus da sonraki yüzyıllarda Antipatros gibi Stoacı hocaların yetiştiği bir kent oldu.', soru:'Bir düşünceyi sağlam yapan nedir: güzel söylenmesi mi, tutarlı olması mı?' },
        en:{ dinle:'Chrysippus was born in Soli around 280 BC. He went to Athens, became a student of Cleanthes and succeeded him as head of the Stoic school. He is said to have written hundreds of works, but none survives whole. He turned Stoic logic, physics and ethics into a system, which is why he is counted as the second founder of the Stoa. In later centuries Tarsus too produced Stoic teachers such as Antipater.', soru:'What makes an idea sound: being well said, or being consistent?' } },
 konya:{ tr:{ dinle:'Mevlânâ Celâleddîn 1207’de bugünkü Afganistan’daki Belh’te doğdu. Ailesi batıya göç etti ve sonunda Selçuklu başkenti Konya’ya yerleşti. 1244’te gezgin derviş Şems-i Tebrîzî ile karşılaşması hayatını değiştirdi. En büyük eseri Mesnevî, sazlıktan koparılıp ney yapılan bir kamışın ayrılık şikâyetiyle başlar. Mevlânâ 1273’te Konya’da öldü; Mevlevîlik yolunu ondan sonra öğrencileri örgütledi.', soru:'Bir ayrılık sana neyi öğretti? Özlem bir kayıp mı, yoksa bir yol mu?' },
        en:{ dinle:'Jalal al-Din Rumi was born in 1207 in Balkh, in today’s Afghanistan. His family moved west and finally settled in Konya, the Seljuk capital. In 1244 his meeting with the wandering dervish Shams of Tabriz changed his life. His great work, the Masnavi, opens with the lament of a reed cut from its reed bed and made into a flute. Rumi died in Konya in 1273; his disciples organised the Mevlevi order after him.', soru:'What has a separation taught you? Is longing a loss, or a path?' } }
};

var H = window.HARITA;
function izd(lon, lat){ return [(lon - H.b0) * H.k * H.s, (H.e1 - lat) * H.s]; }
var EGE = (function(){ var a = izd(25.7, 39.75), b = izd(30.1, 37.3); return [a[0], a[1], b[0] - a[0], b[1] - a[1]]; })();
var GORUNUM = { tum: [0, 0, H.g, H.y], ege: EGE };
function egede(yer){ return yer.lon < 30 && yer.lat > 37.3 && yer.lat < 39.75; }

function dalgalar(){
  var s = '', yer = [[70,420],[150,360],[60,300],[380,440],[520,455],[700,430],[460,30],[620,60],[300,70]];
  yer.forEach(function(p){ s += '<path class="dalga" d="M' + p[0] + ' ' + p[1] + 'q6-5 12 0t12 0t12 0"/>'; });
  return s;
}
function haritaCiz(){
  /* f: bir ekran pikselinin harita birimindeki karşılığı; işaretler her yakınlıkta aynı boyda görünsün */
  var v = GORUNUM[D.zum], gen = $('harita').clientWidth || 760, f = v[2] / gen;
  var r = 12 * f, yaz = 15 * f;
  var dar = gen < 600 && D.zum === 'tum';   /* telefonda Ege pinleri üst üste biner: tek bir küme rozeti göster */
  var pinler = YERLER.map(function(yer, i){
    if (dar && egede(yer)) return '';
    var p = izd(yer.lon, yer.lat), sec = D.secili === yer.id, m = D.muhur[yer.id];
    var etiketGoster = D.zum === 'ege' ? egede(yer) : !egede(yer);
    return '<g class="pin' + (sec ? ' secili' : '') + (m ? ' muhurlu' : '') + '" data-yer="' + yer.id + '" role="button" tabindex="0" aria-label="' + h((i + 1) + '. ' + y(yer).ad + ', ' + y(yer).kim) + '">' +
      '<circle class="nabiz" cx="' + p[0] + '" cy="' + p[1] + '" r="' + r + '" stroke-width="' + (2 * f) + '"/>' +
      '<circle class="halka" cx="' + p[0] + '" cy="' + p[1] + '" r="' + r + '" stroke-width="' + (2.5 * f) + '"/>' +
      '<text x="' + p[0] + '" y="' + (p[1] + 0.5 * f) + '" font-size="' + (12.5 * f) + '">' + (i + 1) + '</text>' +
      (etiketGoster ? '<text class="ad" x="' + (p[0] + r + 5 * f) + '" y="' + p[1] + '" dy="0.35em" font-size="' + yaz + '" stroke-width="' + (4 * f) + '">' + h(y(yer).ad) + '</text>' : '') +
      '</g>';
  }).join('');
  var kume = dar ? (function(){ var c = [EGE[0] + EGE[2] / 2, EGE[1] + EGE[3] / 2], R = 17 * f; return '<g class="pin" id="ege-kume" role="button" tabindex="0" aria-label="' + h(t('ege')) + '"><circle class="halka" cx="' + c[0] + '" cy="' + c[1] + '" r="' + R + '" stroke-width="' + (2.5 * f) + '" style="fill:var(--ege)"/><text x="' + c[0] + '" y="' + c[1] + '" font-size="' + (14 * f) + '">+7</text></g>'; })() : '';
  var egeKutu = D.zum === 'tum' ? '<rect class="ege-kutu" id="ege-kutu" x="' + EGE[0] + '" y="' + EGE[1] + '" width="' + EGE[2] + '" height="' + EGE[3] + '" rx="10"/>' +
    '<text x="' + (EGE[0] + 8) + '" y="' + (EGE[1] + EGE[3] + 18) + '" font-size="14" fill="#1F5C8A" font-style="italic">' + h(D.dil === 'tr' ? 'Ege: 7 durak' : 'Aegean: 7 stops') + '</text>' : '';
  var denizler = D.zum === 'tum' ? '<text class="deniz-ad" x="610" y="48">' + (D.dil === 'tr' ? 'KARADENİZ' : 'BLACK SEA') + '</text><text class="deniz-ad" x="330" y="462">' + (D.dil === 'tr' ? 'AKDENİZ' : 'MEDITERRANEAN') + '</text><text class="deniz-ad" x="22" y="370" transform="rotate(-90 22 370)">' + (D.dil === 'tr' ? 'EGE' : 'AEGEAN') + '</text>' : '';
  $('harita').innerHTML = '<svg viewBox="' + v.join(' ') + '" role="img" aria-label="' + h(t('baslik')) + '">' +
    '<rect x="-50" y="-50" width="' + (H.g + 100) + '" height="' + (H.y + 100) + '" fill="#DCE7EE"/>' + (D.zum === 'tum' ? dalgalar() : '') +
    '<path class="komsu" d="' + H.komsu + '"/>' +
    '<path class="kara" d="' + H.turkiye + '"/>' +
    denizler + egeKutu + (D.bag ? baglarSVG(f, r) : '') + pinler + kume + '</svg>';
  $('z-bag').setAttribute('aria-pressed', !!D.bag); $('z-tum').setAttribute('aria-pressed', D.zum === 'tum'); $('z-ege').setAttribute('aria-pressed', D.zum === 'ege');
}

/* İki yer arasında hafif kavisli bir çizgi; uçlar pinin kenarında durur, ucunda küçük bir ok. */
function baglarSVG(f, r){
  return '<g class="baglar">' + BAGLAR.map(function(b){
    var A = izd(bul(b.a).lon, bul(b.a).lat), B = izd(bul(b.b).lon, bul(b.b).lat);
    var dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    var bukum = Math.min(L * 0.18, 60), K = [(A[0] + B[0]) / 2 - uy * bukum, (A[1] + B[1]) / 2 + ux * bukum];
    var bas = kaydir(A, K, r * 1.25), son = kaydir(B, K, r * 1.35);
    var tx = son[0] - K[0], ty = son[1] - K[1], tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    var o = 7 * f, ok = [son[0], son[1], son[0] - tx * o - ty * o * 0.6, son[1] - ty * o + tx * o * 0.6, son[0] - tx * o + ty * o * 0.6, son[1] - ty * o - tx * o * 0.6];
    var ilgili = D.secili && (b.a === D.secili || b.b === D.secili), soluk = D.secili && !ilgili;
    var sinif = 'bag ' + b.tur + (ilgili ? ' ilgili' : '') + (soluk ? ' soluk' : '');
    return '<g class="' + sinif + '"><title>' + h(b[D.dil]) + '</title><path d="M' + bas[0] + ' ' + bas[1] + 'Q' + K[0] + ' ' + K[1] + ' ' + son[0] + ' ' + son[1] + '"/>' +
      '<polygon points="' + ok.join(' ') + '"/></g>';
  }).join('') + '</g>';
}
function kaydir(P, K, d){ var x = K[0] - P[0], y = K[1] - P[1], l = Math.hypot(x, y) || 1; return [P[0] + x / l * d, P[1] + y / l * d]; }

function listeCiz(){

/* Sesli anlatım: cihazın kendi yapay sesi, internetsiz de çalışır (Efes rehberindeki gibi). */
var sesCalisiyor = false;
function sesDurdur(){ try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e){} sesCalisiyor = false; var b = $('ses-btn'); if (b) b.textContent = t('dinle'); }
function seslendir(){
  if (sesCalisiyor){ sesDurdur(); return; }
  if (!('speechSynthesis' in window)){ bildir(t('sesYok')); return; }
  var yer = bul(D.secili); if (!yer) return;
  var u = new SpeechSynthesisUtterance(DERIN[yer.id][D.dil].dinle);
  u.lang = D.dil === 'tr' ? 'tr-TR' : 'en-GB'; u.rate = 0.95;
  try { var sesler = speechSynthesis.getVoices().filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf(D.dil) === 0; }); if (sesler.length) u.voice = sesler[0]; } catch(e){}
  u.onend = u.onerror = function(){ sesCalisiyor = false; var b = $('ses-btn'); if (b) b.textContent = t('dinle'); };
  speechSynthesis.cancel(); speechSynthesis.speak(u); sesCalisiyor = true;
  var b = $('ses-btn'); if (b) b.textContent = t('durdur');
}

function pasaportCiz(){
  var n = YERLER.filter(function(yer){ return D.muhur[yer.id]; }).length;
  $('pasaport-bolum').innerHTML = '<div class="etiket">ΔΙΑΒΑΤΗΡΙΟΝ</div><h2>' + h(t('pasaport')) + ' · ' + n + ' / ' + YERLER.length + '</h2><p class="soluk">' + h(t('pasaportAlt')) + '</p>' +
    '<div class="pasaport">' + YERLER.map(function(yer){ return '<button type="button" data-yer="' + yer.id + '">' + muhurSVG(yer, !!D.muhur[yer.id]) + '<span>' + h(y(yer).ad) + '</span></button>'; }).join('') + '</div>' +
    '<p class="yakinda">' + h(t('yakinda')) + '</p>';
}

function metinCiz(){
  document.documentElement.lang = D.dil;
  document.title = t('baslik');
  $('ust-etiket').textContent = t('etiket'); $('baslik').textContent = t('baslik'); $('giris').textContent = t('giris');
  $('z-tum').textContent = t('tum'); $('z-ege').textContent = t('ege'); $('z-bag').textContent = t('baglarGoster'); $('harita-not').textContent = (D.zum === 'tum' ? t('egeNot') + ' ' : '') + (D.bag ? t('baglarNot') : '');
  $('alt').innerHTML = '<p>' + h(t('alt1')) + '</p><p>' + h(t('alt2')) + '</p>';
  document.querySelectorAll('[data-dil]').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-dil') === D.dil); });
}
function hepsi(odakla){ metinCiz(); haritaCiz(); listeCiz(); panelCiz(odakla); pasaportCiz(); }

/* ==========================================================================
   SÖZ KARTI (1080x1350 PNG, paylaşılabilir)
   ========================================================================== */
function satirlara(ctx, metin, gen){
  var kel = metin.split(' '), sat = [], s = '';
  kel.forEach(function(k){ var d = s ? s + ' ' + k : k; if (ctx.measureText(d).width > gen && s){ sat.push(s); s = k; } else s = d; });
  if (s) sat.push(s); return sat;
}
function amblemResmi(id){
  return new Promise(function(ok){
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" fill="none" stroke="#E3B38A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#E3B38A">' + AMBLEM[id] + '</svg>';
    var img = new Image(); img.onload = function(){ ok(img); }; img.onerror = function(){ ok(null); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
async function kartYap(){
  var yer = bul(D.secili); if (!yer) return;
  try { await document.fonts.ready; } catch(e){}
  var c = document.createElement('canvas'); c.width = 1080; c.height = 1350;
  var x = c.getContext('2d'), s = yer.soz, F = '"EB Garamond", Georgia, serif';
  x.fillStyle = '#14202C'; x.fillRect(0, 0, 1080, 1350);
  x.strokeStyle = '#36495F'; x.lineWidth = 3; x.strokeRect(48, 48, 984, 1254);
  var img = await amblemResmi(yer.id); if (img) x.drawImage(img, 412, 120, 256, 256);
  x.fillStyle = '#E3B38A'; x.textAlign = 'center'; x.font = '600 34px ' + F;
  x.fillText(yer.yunan.split('').join(' '), 540, 440);
  x.fillStyle = '#F4F1EA'; x.font = (s.eser ? '600 ' : 'italic 500 ') + '64px ' + F;
  var metin = s.eser ? s[D.dil] : '“' + s[D.dil] + '”', sat = satirlara(x, metin, 860), yuk = 82, y0 = 700 - (sat.length - 1) * yuk / 2;
  sat.forEach(function(l, i){ x.fillText(l, 540, y0 + i * yuk); });
  x.fillStyle = '#C3CEDA'; x.font = '400 32px ' + F;
  satirlara(x, (D.dil === 'en' && s.kaynakEn) ? s.kaynakEn : s.kaynak, 860).forEach(function(l, i){ x.fillText(l, 540, y0 + sat.length * yuk + 30 + i * 42); });
  x.fillStyle = '#E3B38A'; x.font = '600 30px ' + F; x.fillText(t('kartAlt') + ' · ' + y(yer).ad, 540, 1240);
  c.toBlob(async function(b){
    var ad = 'felsefe-' + yer.id + '.png';
    try { var dosya = new File([b], ad, { type:'image/png' }); if (navigator.canShare && navigator.canShare({ files:[dosya] })){ await navigator.share({ files:[dosya], title:t('baslik') }); return; } } catch(e){ if (e && e.name === 'AbortError') return; }
    var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = ad; document.body.appendChild(a); a.click(); a.remove();
  }, 'image/png');
}

/* ==========================================================================
   OLAYLAR
   ========================================================================== */
function sec(id, odakla){
  D.secili = id;
  var yer = bul(id);
  if (yer && D.zum === 'tum' && egede(yer) && odakla !== 'harita') D.zum = 'ege';
  try { history.replaceState(null, '', id ? '#' + id : location.pathname); } catch(e){}
  haritaCiz(); listeCiz(); panelCiz(!!odakla); metinCiz();
}
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-yer],[data-dil],[data-eylem],#z-tum,#z-ege,#z-bag,#ege-kutu,#ege-kume');
  if (!el) return;
  if (el.id === 'z-bag'){ D.bag = !D.bag; yaz('fh-bag', D.bag); haritaCiz(); metinCiz(); return; }
  if (el.id === 'z-tum'){ D.zum = 'tum'; haritaCiz(); metinCiz(); return; }
  if (el.id === 'z-ege' || el.id === 'ege-kutu' || el.id === 'ege-kume'){ D.zum = 'ege'; haritaCiz(); metinCiz(); return; }
  if (el.hasAttribute('data-dil')){ sesDurdur(); D.dil = el.getAttribute('data-dil'); yaz('fh-dil', D.dil); hepsi(); return; }
  if (el.hasAttribute('data-yer')){ sesDurdur(); sec(el.getAttribute('data-yer'), el.closest('#harita') ? 'harita' : true); return; }
  var ey = el.getAttribute('data-eylem');
  if (ey === 'muhur'){ D.muhur[D.secili] = new Date().toLocaleDateString(D.dil === 'tr' ? 'tr-TR' : 'en-GB'); yaz('fh-muhur', D.muhur); bildir(t('muhurBildir')); hepsi(); }
  else if (ey === 'kart') kartYap();
  else if (ey === 'ses') seslendir();
  else if (ey === 'not'){ var v = ($('not-alan').value || '').trim().slice(0, 500); if (v) D.notlar[D.secili] = v; else delete D.notlar[D.secili]; yaz('fh-not', D.notlar); bildir(t('kaydedildi')); }
});
document.addEventListener('keydown', function(e){
  if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'ege-kume'){ e.preventDefault(); D.zum = 'ege'; haritaCiz(); metinCiz(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g.pin')){ e.preventDefault(); sec(e.target.getAttribute('data-yer'), 'harita'); }
});
window.addEventListener('resize', function(){ clearTimeout(haritaCiz.z); haritaCiz.z = setTimeout(haritaCiz, 150); });
window.addEventListener('hashchange', function(){ var id = location.hash.slice(1); if (bul(id) && id !== D.secili) sec(id, true); });

(function(){ var id = location.hash.slice(1); if (bul(id)){ D.secili = id; if (egede(bul(id))) D.zum = 'ege'; } hepsi(); })();
</script>
